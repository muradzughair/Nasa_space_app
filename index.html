<!doctype html>
<!--
  Orbit Deck: an interactive 3D Earth presentation.
  Open this file in Chrome, Edge, Firefox or Safari. It works offline as long as
  the assets/ and vendor/ folders stay next to it (if they're missing, it loads
  the same files from the internet instead).
  Edit the slides in the SLIDES list inside the <script type="module"> below.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit Deck</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* Layout: full-bleed globe; slide copy rides a glass panel in the left third
   (a bottom sheet on phones); camera telemetry top right, slide track along the bottom.
   Dark only, on purpose: it's space. */
:root {
  color-scheme: dark;
  --void: #04060b;
  --glass: rgba(7, 11, 20, 0.56);
  --well: rgba(4, 7, 14, 0.78);
  --edge: rgba(206, 220, 255, 0.14);
  --line: rgba(206, 220, 255, 0.18);
  --hatch: rgba(206, 220, 255, 0.035);
  --ink: #edf0f6;
  --ink-dim: #a3acbf;
  --ink-faint: #68728b;
  --sun: #f2b257;   /* sunlight: markers, highlights, current slide */
  --air: #8cc8ff;   /* atmosphere: orbits, secondary marks */
  --ramp-0: #123e5c; --ramp-1: #2fa7c9; --ramp-2: #f2b257; --ramp-3: #fff0c9;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gutter-l: max(28px, env(safe-area-inset-left, 0px));
  --gutter-r: max(28px, env(safe-area-inset-right, 0px));
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--void);
  color: var(--ink);
  font: 400 15px/1.55 var(--font-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }

#globe { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#globe.dragging { cursor: grabbing; }

/* ---------- map labels ---------- */
#labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.label { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
.label-stem { position: absolute; left: 0; bottom: 0; width: 1px; height: 46px; background: linear-gradient(to top, var(--sun), transparent); }
.label-text {
  position: absolute; left: 0; bottom: 46px; display: grid; gap: 3px; white-space: nowrap;
  padding: 6px 9px 6px; background: var(--well); border: 1px solid var(--edge); border-left-color: var(--sun);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.label-text b { font: 600 13.5px/1.15 var(--font-display); font-stretch: 110%; }
.label-text small { font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.label-text em { font: 500 9.5px/1.3 var(--font-mono); font-style: normal; letter-spacing: .14em; text-transform: uppercase; color: var(--sun); }
.label--air .label-text { border-left-color: var(--air); }.label--air .label-stem { background: linear-gradient(to top, var(--air), transparent); }
.label--air .label-text em { color: var(--air); }

/* ---------- top bar ---------- */
.topbar {
  position: fixed; z-index: 5; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;
  padding-top: calc(22px + env(safe-area-inset-top, 0px));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  pointer-events: none; transition: opacity .4s;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 30px; height: 30px; color: var(--sun); flex: none; }
.brand-text { display: grid; gap: 2px; }
.brand-name { font: 700 15px/1.1 var(--font-display); font-stretch: 118%; letter-spacing: .01em; }
.brand-event { font: 400 10.5px/1.3 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.hud { display: flex; gap: 22px; margin: 0; font: 400 12px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
.hud div { display: grid; gap: 4px; justify-items: end; }
.hud dt { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.hud dd { margin: 0; color: var(--ink); }

/* ---------- slide panel ---------- */
.panel {
  position: fixed; z-index: 4;
  left: max(40px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%);
  width: min(450px, 38vw);
  background: var(--glass);
  border: 1px solid var(--edge); border-radius: 3px;
  -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  transition: opacity .28s ease;
}
.panel::before, .panel::after { content: ""; position: absolute; width: 12px; height: 12px; border: 0 solid var(--sun); pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
.panel::after { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }
.panel.is-leaving { opacity: 0; }
.panel-body {
  display: flex; flex-direction: column; gap: 18px;
  padding: 30px 30px 28px;
  max-height: calc(100vh - 230px); overflow: auto; scrollbar-width: thin;
}
.panel.hero {
  top: auto; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); transform: none;
  width: min(760px, 54vw);
  background: none; border-color: transparent;
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
.panel.hero::before, .panel.hero::after { display: none; }
.panel.hero .panel-body { padding: 0; max-height: none; overflow: visible; gap: 22px; }
.panel-body > * { margin: 0; animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.eyebrow { display: flex; align-items: center; gap: 10px; font: 500 11px/1.2 var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--sun); }
.eyebrow::before { content: ""; width: 18px; height: 1px; background: currentColor; flex: none; }
.title { font-family: var(--font-display); font-weight: 700; font-stretch: 118%; font-size: clamp(26px, 2.5vw, 38px); line-height: 1.04; letter-spacing: -.012em; text-wrap: balance; margin-top: -6px !important; }
.hero .title { font-weight: 800; font-stretch: 125%; font-size: clamp(50px, 6.6vw, 104px); line-height: .9; letter-spacing: -.025em; text-shadow: 0 2px 28px var(--void); }
.sub { font-size: clamp(16px, 1.35vw, 19px); line-height: 1.5; color: var(--ink-dim); max-width: 44ch; text-wrap: pretty; }
.body { color: var(--ink-dim); max-width: 60ch; text-wrap: pretty; }
.note { font: 400 12px/1.55 var(--font-mono); color: var(--ink-faint); }
.tag { display: inline-block; vertical-align: middle; margin-left: 10px; padding: 3px 5px 2px; border: 1px solid currentColor; border-radius: 2px; font: 500 9.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }

.stat { display: grid; gap: 4px; padding-block: 10px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat-value { margin: 0; display: flex; align-items: baseline; font-family: var(--font-display); font-weight: 200; font-size: clamp(64px, 7vw, 104px); line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.stat-unit { margin-left: 4px; font-size: .42em; font-weight: 400; letter-spacing: 0; color: var(--sun); }
.stat-value .tag { align-self: center; letter-spacing: .14em; }
.stat-caption { margin: 0; font-size: 13.5px; color: var(--ink-dim); }

.bullets { list-style: none; padding: 0; display: grid; }
.bullets li { display: grid; grid-template-columns: 22px 1fr; align-items: baseline; padding-block: 10px; border-top: 1px solid var(--line); }
.bullets li:last-child { border-bottom: 1px solid var(--line); }
.bullets li::before { content: ""; width: 10px; height: 1px; background: var(--sun); transform: translateY(-4px); }

.sources { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.sources li { display: grid; align-content: start; gap: 5px; padding: 14px 14px 13px; background: var(--well); min-width: 0; }
.sources b { font: 600 14px/1.2 var(--font-display); font-stretch: 108%; }
.sources span { font: 400 11px/1.45 var(--font-mono); color: var(--ink-dim); }

.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { padding: 0 0 10px; text-align: left; font: 500 10px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.table th:last-child, .table td:last-child { text-align: right; }
.table td { padding-block: 11px; border-top: 1px solid var(--line); }
.num { display: inline-flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.bar { position: relative; width: 84px; height: 4px; background: var(--line); }
.bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--v) * 100%); background: var(--sun); }

.legend { display: grid; gap: 8px; }
.legend-head { display: flex; justify-content: space-between; align-items: center; font: 500 10px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.legend-head .tag { margin: 0; }
.ramp { height: 8px; background: linear-gradient(90deg, var(--ramp-0), var(--ramp-1) 35%, var(--ramp-2) 70%, var(--ramp-3)); }
.legend-ends { display: flex; justify-content: space-between; font: 400 11px/1 var(--font-mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }

.media { display: grid; gap: 10px; }
.media-slot, .media img, .media video { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 1px solid var(--edge); }
.media-slot {
  display: grid; place-content: center; justify-items: center; gap: 8px; padding: 16px; text-align: center;
  border-style: dashed; border-color: var(--line); color: var(--ink-dim); font-size: 13px;
  background: repeating-linear-gradient(135deg, transparent 0 10px, var(--hatch) 10px 20px);
}
.media-slot svg { width: 26px; height: 26px; color: var(--sun); }
.media-slot code { font: 400 11px/1.4 var(--font-mono); color: var(--ink-faint); }
.media figcaption { font-size: 13.5px; color: var(--ink-dim); }

.team { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; }
.team li { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 12px; min-width: 0; }
.avatar { width: 44px; height: 44px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--edge); border-radius: 50%; background: var(--well); color: var(--ink-faint); }
.avatar svg { width: 22px; height: 22px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who { display: grid; gap: 2px; min-width: 0; }
.who b { font: 600 14px/1.2 var(--font-display); font-stretch: 108%; }
.who span { font: 400 11px/1.35 var(--font-mono); color: var(--ink-dim); }

.meta { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 18px; font: 500 11.5px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.meta li:not(:last-child) { padding-right: 18px; border-right: 1px solid var(--line); }

.links { display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; }
.links dt { padding-top: 2px; font: 500 10.5px/1.6 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.links dd { margin: 0; font: 400 14px/1.6 var(--font-mono); color: var(--ink); overflow-wrap: anywhere; }

/* ---------- hint, dock, loader ---------- */
.hint {
  position: fixed; z-index: 5; right: var(--gutter-r); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  margin: 0; display: flex; align-items: center; gap: 18px; white-space: nowrap;
  font: 400 11.5px/1 var(--font-mono); color: var(--ink-dim);
  pointer-events: none; transition: opacity .6s;
}
.hint.is-off { opacity: 0; }
.hint-touch { display: none; }
@media (pointer: coarse) { .hint-mouse { display: none; } .hint-touch { display: inline; } }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-right: 5px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; font: 500 11px/1 var(--font-mono); color: var(--ink); }

.dock {
  position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: 14px;
  padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  transition: opacity .4s;
}
.navbtn {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--edge); border-radius: 50%; background: var(--glass);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  cursor: pointer; transition: border-color .2s, color .2s, opacity .2s;
}
.navbtn svg { width: 16px; height: 16px; }
.navbtn:hover:not(:disabled) { border-color: var(--sun); color: var(--sun); }
.navbtn:disabled { opacity: .35; cursor: default; }
.track { flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 6px; }
.track button { position: relative; flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.track button::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--line); transition: background .3s; }
.track button.done::before { background: var(--ink-faint); }
.track button:hover::before { background: var(--ink-dim); }
.track button.current::before { height: 3px; margin-top: -1.5px; background: var(--sun); }
.track button::after {
  content: attr(data-title); position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%);
  padding: 7px 9px; white-space: nowrap; font: 400 11px/1 var(--font-mono); color: var(--ink);
  background: var(--well); border: 1px solid var(--edge); opacity: 0; pointer-events: none; transition: opacity .15s;
}
.track button.tip-start::after { left: 0; transform: none; }
.track button.tip-end::after { left: auto; right: 0; transform: none; }
.track button:hover::after, .track button:focus-visible::after { opacity: 1; }
.counter { flex: none; font: 400 12px/1 var(--font-mono); letter-spacing: .06em; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.counter b { font-weight: 500; color: var(--ink); }
body.chrome-off .topbar, body.chrome-off .dock, body.chrome-off .hint { opacity: 0; pointer-events: none; }

.loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--void); transition: opacity .9s ease; }
.loader.done { opacity: 0; pointer-events: none; }
.loader-inner { display: grid; justify-items: center; gap: 12px; padding: 0 24px; text-align: center; font: 400 11.5px/1.5 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.loader-track { width: 180px; height: 1px; background: var(--line); overflow: hidden; }
.loader-bar { display: block; height: 100%; background: var(--sun); transform-origin: left; transform: scaleX(.04); transition: transform .4s; }
.loader-count { font-size: 10.5px; color: var(--ink-faint); }

.toast {
  position: fixed; z-index: 7; top: calc(78px + env(safe-area-inset-top, 0px)); right: var(--gutter-r);
  max-width: min(360px, calc(100% - 56px)); margin: 0; padding: 10px 12px;
  font: 400 12px/1.45 var(--font-mono); color: var(--ink); background: var(--well); border: 1px solid var(--edge);
}

/* ---------- phones ---------- */
@media (max-width: 760px) {
  :root { --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .panel { left: var(--gutter-l); right: var(--gutter-r); width: auto; top: auto; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); transform: none; }
  .panel-body { padding: 20px 18px 18px; gap: 14px; max-height: 46vh; }
  .panel.hero { width: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .hero .title { font-size: clamp(44px, 13vw, 72px); }
  .stat-value { font-size: 60px; }
  .dock { gap: 10px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .navbtn { width: 38px; height: 38px; }
  .track { gap: 3px; }
  .hint { display: none; }
  .toast { top: calc(64px + env(safe-area-inset-top, 0px)); }
}
@media (max-width: 560px) { .hud .hud-ll { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .panel-body > * { animation: none; }
  .panel, .loader { transition: none; }
}
</style>
</head>
<body>

<canvas id="globe" aria-label="Interactive 3D Earth. Drag to rotate, scroll or pinch to zoom."></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="currentColor" stroke-width="1" opacity=".7" transform="rotate(-24 16 16)"/>
      <circle cx="28.2" cy="10.7" r="1.8" fill="currentColor"/>
    </svg>
    <div class="brand-text"><span class="brand-name" id="brandName"></span><span class="brand-event" id="brandEvent"></span></div>
  </div>
  <dl class="hud" aria-label="Camera position">
    <div class="hud-ll"><dt>Lat</dt><dd id="hudLat">&mdash;</dd></div>
    <div class="hud-ll"><dt>Lon</dt><dd id="hudLon">&mdash;</dd></div>
    <div><dt>Altitude</dt><dd id="hudAlt">&mdash;</dd></div>
  </dl>
</header>

<main id="panel" class="panel hero" aria-live="polite">
  <div class="panel-body" id="panelBody"></div>
</main>

<p class="hint" id="hint">
  <span class="hint-mouse"><kbd>&rarr;</kbd>next &nbsp; <kbd>&larr;</kbd>back</span>
  <span class="hint-mouse">Drag to rotate &middot; scroll to zoom</span>
  <span class="hint-mouse"><kbd>F</kbd>full screen &nbsp; <kbd>H</kbd>hide controls</span>
  <span class="hint-touch">Drag to rotate &middot; pinch to zoom</span>
</p>

<nav class="dock" aria-label="Slides">
  <button class="navbtn" id="prev" type="button" aria-label="Previous slide">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
  </button>
  <button class="navbtn" id="next" type="button" aria-label="Next slide">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>
  </button>
  <div class="track" id="track"></div>
  <span class="counter" id="counter"></span>
  <button class="navbtn" id="fs" type="button" aria-label="Toggle full screen">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
  </button>
</nav>

<div class="loader" id="loader" role="status">
  <div class="loader-inner">
    <span class="loader-label" id="loaderLabel">Loading Earth imagery</span>
    <span class="loader-track"><span class="loader-bar" id="loaderBar"></span></span>
    <span class="loader-count" id="loaderCount">0 of 3</span>
  </div>
</div>
<p class="toast" id="toast" hidden></p>

<script src="vendor/three.js"></script>
<script src="assets/earth-textures.js"></script>
<script type="module">
// Local copy first (works offline); the same version from the internet if the vendor/ folder is missing.
const THREE = window.THREE ?? await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');

/* =====================================================================
   EDIT YOUR DECK HERE
   ---------------------------------------------------------------------
   Every slide flies the camera to its `view`:
     lat, lon   degrees (south and west are negative)
     dist       camera distance from that point, in Earth radii
                (1 = 6,371 km; 3 or more shows the whole planet, 0.3 is close)
     tilt       0 looks straight down, 60 looks toward the horizon
     heading    compass direction the camera faces (0 = north)

   Optional scene settings per slide:
     layout: 'hero'                       big title, no panel box
     sun: 'day' | 'dusk' | 'night'        lighting on the target
     spin: true                           slow rotation while you talk
     clouds: 0 to 1                       cloud cover (default 1)
     markers: [{ lat, lon, label, note }] pins with labels
     places:  { label, sample, rows: [{ name, lat, lon, value }] }
                                          pins and a table from one list
     ring:    { radius }                  dashed study-area circle, in degrees
     data:    { lat, lon, radius, seed }  3D columns of sample values on land
     orbit:   true                        example satellite orbit

   Text blocks (all optional): eyebrow, title, sub, body, stat, bullets,
   chips, legend, media, team, meta, links, note. Plain HTML is allowed.
   ===================================================================== */
const DECK = { name: 'Project Name', event: 'NASA Space Apps Challenge' };

const SLIDES = [
  {
    id: 'intro', layout: 'hero', spin: true,
    view: { lat: 18, lon: -38, dist: 3.3 },
    eyebrow: 'NASA Space Apps Challenge',
    title: 'Project<br>Name',
    sub: 'One sentence on what you built, who it helps, and which NASA data powers it.',
    meta: ['Team [name]', 'Challenge: [title]', '[City, Country]'],
  },
  {
    id: 'challenge',
    view: { lat: -4, lon: -62, dist: 1.45, tilt: 12 },
    ring: { radius: 12 },
    eyebrow: 'The challenge',
    title: 'State the problem in one line',
    body: 'Say what is happening, where, and why it matters now. Two or three sentences a judge could repeat back to you.',
    bullets: ['Who is affected', 'What it costs: people, land, money or time', 'Why current tools fall short'],
  },
  {
    id: 'zoom',

const TEX = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/textures/planets/';
const EARTH_KM = 6371;
const SUN_ANGLE = { day: 0.8, dusk: 1.5, night: 2.35 };
const LAND_G = 90;            // green channel of the relief map is low over water
const ATMO_R = 1.075;         // atmosphere shell radius (Earth = 1)
const COLOR_SUN = new THREE.Color('#f2b257');
const COLOR_AIR = new THREE.Color('#8cc8ff');
const RAMP = [[0, '#123e5c'], [0.35, '#2fa7c9'], [0.7, '#f2b257'], [1, '#fff0c9']].map(([t, c]) => [t, new THREE.Color(c)]);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mqPhone = matchMedia('(max-width: 760px)');

const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const wrapLon = l => ((((l + 180) % 360) + 360) % 360) - 180;
const plain = html => html.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '');
const fmtLat = v => `${Math.abs(v).toFixed(2).padStart(5, '0')}° ${v >= 0 ? 'N' : 'S'}`;
const fmtLon = v => `${Math.abs(v).toFixed(2).padStart(6, '0')}° ${v >= 0 ? 'E' : 'W'}`;
const fmtVal = v => Number(v).toFixed(2);

function llToVec(lat, lon, r = 1, out = new THREE.Vector3()) {
  const la = lat * D2R, lo = lon * D2R;
  return out.set(Math.cos(la) * Math.cos(lo) * r, Math.sin(la) * r, -Math.cos(la) * Math.sin(lo) * r);
}
function vecToLL(v) {
  const n = v.clone().normalize();
  return { lat: Math.asin(clamp(n.y, -1, 1)) * R2D, lon: Math.atan2(-n.z, n.x) * R2D };

// Surface normal plus local north and east at a point.

    n: new THREE.Vector3(Math.cos(la) * Math.cos(lo), Math.sin(la), -Math.cos(la) * Math.sin(lo)),
    north: new THREE.Vector3(-Math.sin(la) * Math.cos(lo), Math.cos(la), Math.sin(la) * Math.sin(lo)),
    east: new THREE.Vector3(-Math.sin(lo), 0, -Math.cos(lo)),

}

}

      return out.copy(c0).lerp(c1, (v - t0) / (t1 - t0));

const manager = new THREE.LoadingManager();

function loadTex(file, srgb, key) {

const F_DAY = 'earth_day_4096.jpg', F_NIGHT = 'earth_night_4096.jpg', F_BRC = 'earth_bump_roughness_clouds_4096.jpg';
const dayTex = loadTex(F_DAY, true, 'day');

/* ---------- Earth, clouds, atmosphere, stars ---------- */
const sunDir = new THREE.Vector3(1, 0.3, 0.5).normalize();
const shared = { sunDir: { value: sunDir }, cloudShift: { value: 0 }, cloudAmount: { value: 1 } };

const SPHERE_VS = /* glsl */`
  varying vec2 vUv; varying vec3 vN; varying vec3 vP;
  void main() {
    vUv = uv;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vP = wp.xyz;
    vN = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;

const earthMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, dayMap: { value: dayTex }, nightMap: { value: nightTex }, brcMap: { value: brcTex }, bumpScale: { value: 0.006 } },
  vertexShader: SPHERE_VS,
  fragmentShader: /* glsl */`
    uniform sampler2D dayMap, nightMap, brcMap;
    uniform vec3 sunDir; uniform float cloudShift, cloudAmount, bumpScale;
    varying vec2 vUv; varying vec3 vN; varying vec3 vP;

    vec3 bumpNormal(vec3 n) {
      vec2 dx = dFdx(vUv), dy = dFdy(vUv);
      float h0 = texture2D(brcMap, vUv).r;
      vec2 dH = vec2(texture2D(brcMap, vUv + dx).r - h0, texture2D(brcMap, vUv + dy).r - h0) * bumpScale;
      vec3 sx = dFdx(vP), sy = dFdy(vP);
      vec3 r1 = cross(sy, n), r2 = cross(n, sx);
      float det = dot(sx, r1);
      vec3 grad = sign(det) * (dH.x * r1 + dH.y * r2);
      return normalize(abs(det) * n - grad);
    }

    void main() {
      vec3 n = normalize(vN);
      vec3 L = normalize(sunDir);
      vec3 V = normalize(cameraPosition - vP);
      float sunGeo = dot(n, L);
      float dayMix = smoothstep(-0.10, 0.30, sunGeo);

      vec4 brc = texture2D(brcMap, vUv);
      float cloud = smoothstep(0.2, 1.0, texture2D(brcMap, vUv + vec2(cloudShift, 0.0)).b) * cloudAmount;
      float water = 1.0 - smoothstep(0.05, 0.35, brc.g);

      vec3 day = texture2D(dayMap, vUv).rgb;
      float diffuse = clamp(dot(bumpNormal(n), L), 0.0, 1.0);
      vec3 col = day * (diffuse * 1.1 + 0.012) * (1.0 - cloud * 0.4);

      vec3 H = normalize(L + V);
      float nh = max(dot(n, H), 0.0);
      col += vec3(1.0, 0.9, 0.75) * pow(nh, 160.0) * water * (1.0 - cloud) * 0.2 * dayMix;
      col += vec3(0.35, 0.55, 0.9) * pow(nh, 14.0) * water * 0.03 * dayMix;

      vec3 lights = texture2D(nightMap, vUv).rgb;
      col += lights * vec3(1.0, 0.76, 0.46) * 2.4 * (1.0 - dayMix) * (1.0 - cloud * 0.7);

      float rim = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.0);
      vec3 atmo = mix(vec3(1.0, 0.5, 0.25), vec3(0.32, 0.6, 1.0), smoothstep(-0.1, 0.45, sunGeo));
      col += atmo * rim * smoothstep(-0.12, 0.5, sunGeo) * 1.1;

      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 96), earthMat);
scene.add(earth);

const cloudMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, brcMap: { value: brcTex } },
  vertexShader: SPHERE_VS,
  fragmentShader: /* glsl */`
    uniform sampler2D brcMap; uniform vec3 sunDir; uniform float cloudShift, cloudAmount;
    varying vec2 vUv; varying vec3 vN; varying vec3 vP;
    void main() {
      float c = smoothstep(0.2, 1.0, texture2D(brcMap, vUv + vec2(cloudShift, 0.0)).b) * cloudAmount;
      float s = dot(normalize(vN), normalize(sunDir));
      float light = smoothstep(-0.12, 0.4, s);
      vec3 col = mix(vec3(1.0, 0.72, 0.5), vec3(1.0), smoothstep(0.05, 0.35, s)) * (0.03 + 0.97 * light);
      gl_FragColor = vec4(col, c * (0.15 + 0.85 * light));
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false,
});
const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.006, 160, 80), cloudMat);
clouds.renderOrder = 1;
scene.add(clouds);

const atmoMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: shared.sunDir, edge: { value: Math.sqrt(1 - 1 / (ATMO_R * ATMO_R)) } },
  vertexShader: SPHERE_VS,
  fragmentShader: /* glsl */`
    uniform vec3 sunDir; uniform float edge;
    varying vec2 vUv; varying vec3 vN; varying vec3 vP;
    void main() {
      vec3 n = normalize(vN);
      float d = dot(n, normalize(vP - cameraPosition));   // 0 at the outer rim, 'edge' at the planet's limb
      float glow = pow(clamp(d / edge, 0.0, 1.0), 2.2);
      float s = dot(n, normalize(sunDir));
      vec3 col = mix(vec3(1.0, 0.45, 0.2), vec3(0.3, 0.58, 1.0), smoothstep(-0.15, 0.4, s));
      gl_FragColor = vec4(col * 1.25, glow * smoothstep(-0.25, 0.35, s));
      #include <colorspace_fragment>
    }`,
  side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(ATMO_R, 96, 48), atmoMat);
atmosphere.renderOrder = 2;
scene.add(atmosphere);

const starMat = (() => {
  const N = 5200, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N);
  const rng = mulberry32(42), v = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    v.set(rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1);
    if (v.lengthSq() > 1 || v.lengthSq() < 1e-4) { i--; continue; }
    v.normalize().multiplyScalar(1200).toArray(pos, i * 3);
    const r = rng();
    c.setHSL(r < 0.3 ? 0.08 : 0.6, r < 0.3 ? 0.5 : 0.35, 0.75 + rng() * 0.25).toArray(col, i * 3);
    size[i] = 0.7 + Math.pow(rng(), 7) * 3.2;

  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { pr: { value: renderer.getPixelRatio() } },

    fragmentShader: `varying vec3 vC;

/* ---------- camera rig ---------- */
// The camera is described by the point it looks at plus distance, tilt and heading.
const view = { lat: 42, lon: -112, dist: 16, tilt: 0, heading: 0 };
const T = new THREE.Vector3();
function applyCamera() {
  view.lat = clamp(view.lat, -85, 85);
  view.lon = wrapLon(view.lon);
  const f = frameAt(view.lat, view.lon);
  const t = view.tilt * D2R, h = view.heading * D2R;
  const fwd = f.north.clone().multiplyScalar(Math.cos(h)).addScaledVector(f.east, Math.sin(h));
  const dir = f.n.clone().multiplyScalar(Math.cos(t)).addScaledVector(fwd, -Math.sin(t));
  const ct = Math.cos(t), minR = 1.1;                       // stay outside the atmosphere shell
  view.dist = Math.max(view.dist, -ct + Math.sqrt(ct * ct - 1 + minR * minR));
  T.copy(f.n);
  camera.position.copy(T).addScaledVector(dir, view.dist);
  camera.up.copy(fwd).multiplyScalar(Math.cos(t)).addScaledVector(f.n, Math.sin(t));
  camera.lookAt(T);
  camera.updateMatrixWorld();
}

let flight = null;
function slerpUnit(a, b, theta, t) {
  if (theta < 1e-5) return a.clone();
  const s = Math.sin(theta);
  if (s < 1e-4) return a.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI * t);
  return a.clone().multiplyScalar(Math.sin((1 - t) * theta) / s).addScaledVector(b, Math.sin(t * theta) / s);
}
function flyTo(v, instant) {
  const to = { lat: v.lat, lon: v.lon, dist: v.dist, tilt: v.tilt ?? 0, heading: v.heading ?? 0 };
  if (instant || reduceMotion) { Object.assign(view, to); flight = null; return 0; }
  const from = { ...view };
  const a = llToVec(from.lat, from.lon), b = llToVec(to.lat, to.lon);
  const theta = a.angleTo(b);
  const dur = clamp(1.5 + theta * 0.95 + Math.abs(Math.log(to.dist / from.dist)) * 0.28, 1.6, 3.8);
  flight = { from, to, a, b, theta, dur, t: 0 };
  return dur;
}
function stepFlight(dt) {
  const F = flight;
  F.t = Math.min(1, F.t + dt / F.dur);
  const t = F.t, e = easeInOut(t), arc = Math.sin(Math.PI * t);
  const ll = vecToLL(slerpUnit(F.a, F.b, F.theta, e));
  view.lat = ll.lat; view.lon = ll.lon;
  // zoom in log space and climb on long hops, like a flight path
  const l0 = Math.log(F.from.dist), l1 = Math.log(F.to.dist);
  const lift = Math.max(0, Math.log(Math.max(F.theta * 2.1, 1e-3)) - (l0 + l1) / 2);
  view.dist = Math.exp(lerp(l0, l1, e) + lift * arc);
  view.tilt = lerp(F.from.tilt, F.to.tilt, e) * (1 - 0.85 * arc * Math.min(1, F.theta * 1.4));
  view.heading = F.from.heading + ((((F.to.heading - F.from.heading) % 360) + 540) % 360 - 180) * e;
  if (t >= 1) { Object.assign(view, F.to); flight = null; }
}

/* ---------- labels ---------- */
const labelsEl = $('labels');
const labels = [];
function makeLabel(pos, html, cls = '') {
  const el = document.createElement('div');
  el.className = 'label ' + cls;
  el.innerHTML = `<span class="label-stem"></span><span class="label-text">${html}</span>`;
  labelsEl.appendChild(el);
  const L = { el, pos, alpha: 0, vis: 0, on: false };
  labels.push(L);
  return L;
}
const tmp = new THREE.Vector3(), pv = new THREE.Vector3();
function occluded(P) {
  const C = camera.position;
  tmp.subVectors(P, C);
  const len = tmp.length();
  tmp.divideScalar(len);
  const b = C.dot(tmp), disc = b * b - (C.lengthSq() - 1);
  if (disc <= 0) return false;
  const hit = -b - Math.sqrt(disc);
  return hit > 0 && hit < len - 0.004;
}
function updateLabels(dt) {
  const W = innerWidth, H = innerHeight;
  for (const L of labels) {
    if (L.alpha < 0.01) {
      if (L.on) { L.el.style.opacity = '0'; L.on = false; }
      continue;
    }
    L.on = true;
    pv.copy(L.pos).project(camera);
    L.vis = damp(L.vis, pv.z > 1 || occluded(L.pos) ? 0 : 1, 12, dt);
    const x = (pv.x * 0.5 + 0.5) * W, y = (-pv.y * 0.5 + 0.5) * H;
    // slide the label box sideways so it never runs off screen
    L.w ||= L.el.lastChild.offsetWidth;
    const shift = Math.round(Math.max(16 - x, Math.min(0, W - 16 - L.w - x)));
    if (shift !== L.shift) { L.shift = shift; L.el.lastChild.style.transform = shift ? `translateX(${shift}px)` : ''; }
    L.el.style.opacity = (L.alpha * L.vis).toFixed(3);
    L.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
  }
}

/* ---------- scene features (markers, study area, data columns, orbit) ---------- */
const Z = new THREE.Vector3(0, 0, 1);
const allFeatures = new Set();
function fade(f, dt, speed = 3) {
  f.alpha = damp(f.alpha, f.target, speed, dt);
  if (Math.abs(f.alpha - f.target) < 0.002) f.alpha = f.target;
}

const ringGeo = new THREE.RingGeometry(0.7, 1, 64);
const dotGeo = new THREE.CircleGeometry(0.3, 32);
function makeMarker({ lat, lon, label, note, sub }) {
  const pos = llToVec(lat, lon, 1.0015);
  const group = new THREE.Group();
  group.position.copy(pos);
  group.quaternion.setFromUnitVectors(Z, pos.clone().normalize());
  const ringMat = new THREE.MeshBasicMaterial({ color: COLOR_SUN, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
  const dotMat = ringMat.clone();
  const ring = new THREE.Mesh(ringGeo, ringMat), dot = new THREE.Mesh(dotGeo, dotMat);
  ring.renderOrder = dot.renderOrder = 5;
  group.add(ring, dot);
  group.visible = false;
  scene.add(group);
  const lab = makeLabel(pos, `<b>${label}</b><small>${sub ?? `${fmtLat(lat)} · ${fmtLon(lon)}`}</small>${note ? `<em>${note}</em>` : ''}`);
  const phase = Math.random();
  return {
    alpha: 0, target: 0,
    update(dt, time) {
      fade(this, dt);
      lab.alpha = this.alpha;
      group.visible = this.alpha > 0.01;
      if (!group.visible) return;
      group.scale.setScalar(camera.position.distanceTo(pos) * 0.016);   // constant size on screen
      const p = reduceMotion ? 0.4 : (time * 0.55 + phase) % 1;
      ring.scale.setScalar(1 + p * 1.8);
      ringMat.opacity = this.alpha * (1 - p) * 0.9;
      dotMat.opacity = this.alpha;
    },
  };
}

function makeArea(lat, lon, radiusDeg) {
  const f = frameAt(lat, lon), rho = radiusDeg * D2R, pts = [];
  for (let i = 0; i <= 200; i++) {
    const a = (i / 200) * Math.PI * 2;
    pts.push(f.n.clone().multiplyScalar(Math.cos(rho))
      .addScaledVector(f.north, Math.sin(rho) * Math.cos(a))
      .addScaledVector(f.east, Math.sin(rho) * Math.sin(a))
      .multiplyScalar(1.004));
  }
  const mat = new THREE.LineDashedMaterial({ color: COLOR_SUN, dashSize: 0.014, gapSize: 0.009, transparent: true, opacity: 0, depthWrite: false });
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
  line.computeLineDistances();
  line.renderOrder = 4;
  line.visible = false;
  scene.add(line);
  const lab = makeLabel(pts[0].clone(), `<b>Study area</b><small>radius ≈ ${Math.round(radiusDeg * 111.2).toLocaleString('en-US')} km</small>`);
  return {
    alpha: 0, target: 0,
    update(dt) {
      fade(this, dt);
      line.visible = this.alpha > 0.01;
      mat.opacity = this.alpha * 0.9;
      lab.alpha = this.alpha;
    },

}

// Sample values: a few smooth hotspots plus ripple. Replace with your own rows.
function makeData(cfg, landAt) {
  const rng = mulberry32(cfg.seed ?? 1);
  const R0 = cfg.radius ?? 10, step = cfg.step ?? 0.75, HMAX = cfg.height ?? 0.14;
  const blobs = Array.from({ length: 6 }, () => ({
    lat: cfg.lat + (rng() - 0.5) * R0 * 1.4, lon: cfg.lon + (rng() - 0.5) * R0 * 1.4,
    r: 1.6 + rng() * 3.5, a: 0.35 + rng() * 0.65,
  }));
  const center = llToVec(cfg.lat, cfg.lon);
  const cells = [];
  let row = 0;
  for (let la = cfg.lat - R0; la <= cfg.lat + R0; la += step * 0.866, row++) {
    const cosl = Math.max(0.2, Math.cos(la * D2R)), lonStep = step / cosl;
    for (let lo = cfg.lon - R0 / cosl + (row % 2) * lonStep / 2; lo <= cfg.lon + R0 / cosl; lo += lonStep) {
      const v = llToVec(la, lo);
      const ang = center.angleTo(v) * R2D;
      if (ang > R0 || (landAt && !landAt(la, lo))) continue;
      let val = 0;
      for (const b of blobs) {
        const dl = la - b.lat, dn = (lo - b.lon) * cosl;
        val += b.a * Math.exp(-(dl * dl + dn * dn) / (b.r * b.r));
      }
      val += 0.07 * Math.sin(la * 1.7 + lo * 0.9) + 0.05 * rng();
      val = Math.max(0, val * (1 - 0.3 * ang / R0));
      cells.push({ v, lat: la, lon: lo, val, delay: (ang / R0) * 0.7 + rng() * 0.15, q: new THREE.Quaternion().setFromUnitVectors(Z, v) });
    }
  }
  // scale so the highest cell reads 1.0 and the rest spread below it
  const vmax = cells.reduce((m, c) => Math.max(m, c.val), 1e-6);
  cells.forEach(c => { c.val = 0.04 + 0.96 * Math.pow(c.val / vmax, 1.25); });
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1).translate(0, 0, 0.5), new THREE.MeshLambertMaterial({ color: 0xffffff }), Math.max(1, cells.length));
  mesh.count = cells.length;
  const col = new THREE.Color();
  cells.forEach((c, i) => mesh.setColorAt(i, rampColor(c.val, col)));
  mesh.frustumCulled = false;
  mesh.visible = false;
  mesh.renderOrder = 3;
  scene.add(mesh);
  const peak = cells.reduce((m, c) => (c.val > m.val ? c : m), cells[0] ?? { val: 0 });
  const lab = cells.length
    ? makeLabel(peak.v.clone().multiplyScalar(1 + peak.val * HMAX), `<b>Peak ${fmtVal(peak.val)}</b><small>${fmtLat(peak.lat)} · ${fmtLon(peak.lon)}</small><em>Sample</em>`)
    : null;
  const w = step * D2R * 0.62, m4 = new THREE.Matrix4(), sc = new THREE.Vector3();
  return {
    alpha: 0, target: 0, clock: 0,
    activate() { if (this.alpha < 0.5) this.clock = 0; },
    update(dt) {
      fade(this, dt, 4);
      mesh.visible = this.alpha > 0.01 && cells.length > 0;
      if (lab) lab.alpha = 0;
      if (!mesh.visible) return;
      if (this.target === 1) this.clock += dt;
      if (this.target === 1 && this.clock > 2.5 && this.settled) { if (lab) lab.alpha = this.alpha; return; }
      cells.forEach((c, i) => {
        const g = this.target === 1 ? easeOut(clamp((this.clock - c.delay) / 0.9, 0, 1)) : this.alpha;
        mesh.setMatrixAt(i, m4.compose(c.v, c.q, sc.set(w, w, Math.max(1e-4, c.val * HMAX * g))));
      });
      mesh.instanceMatrix.needsUpdate = true;
      this.settled = this.target === 1 && this.clock > 2.5;
      if (lab) lab.alpha = this.target === 1 ? clamp((this.clock - peak.delay - 0.6) * 2, 0, 1) : 0;
    },
  };
}

function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d'), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.18, 'rgba(210,235,255,0.9)');
  grd.addColorStop(0.45, 'rgba(140,200,255,0.25)');
  grd.addColorStop(1, 'rgba(140,200,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
let orbitFeature = null;
function makeOrbit(v) {
  const RO = 1.32;
  const f = frameAt(v.lat, v.lon);
  const normal = f.north.clone().multiplyScalar(Math.cos(0.32)).addScaledVector(f.n, Math.sin(0.32)).applyAxisAngle(f.n, 22 * D2R).normalize();
  const group = new THREE.Group();
  group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
  const pts = [];
  for (let i = 0; i <= 256; i++) { const a = (i / 256) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * RO, 0, Math.sin(a) * RO)); }
  const lineMat = new THREE.LineBasicMaterial({ color: COLOR_AIR, transparent: true, opacity: 0, depthWrite: false });
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat);
  const satMat = new THREE.SpriteMaterial({ map: glowTexture(), transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
  const sat = new THREE.Sprite(satMat);
  sat.scale.setScalar(0.1);
  line.renderOrder = sat.renderOrder = 4;
  group.add(line, sat);
  group.visible = false;
  scene.add(group);
  const satWorld = new THREE.Vector3();
  const lab = makeLabel(satWorld, '<b>Example satellite</b><small>Orbit not to scale</small>', 'label--air');
  let a = 2.2;
  return {
    alpha: 0, target: 0,
    update(dt) {
      fade(this, dt);
      group.visible = this.alpha > 0.01;
      lab.alpha = this.alpha;
      if (!group.visible) return;
      if (!reduceMotion) a += dt * 0.3;
      sat.position.set(Math.cos(a) * RO, 0, Math.sin(a) * RO);
      group.updateMatrixWorld();
      satWorld.copy(sat.position).applyMatrix4(group.matrixWorld);
      lineMat.opacity = this.alpha * 0.55;
      satMat.opacity = this.alpha;
    },
  };
}

function buildFeatures(landAt) {
  for (const s of SLIDES) {
    s._f = [];
    (s.markers || []).forEach(m => s._f.push(makeMarker(m)));
    if (s.places) s.places.rows.forEach(p => s._f.push(makeMarker({ lat: p.lat, lon: p.lon, label: p.name, sub: `${s.places.label} ${fmtVal(p.value)}` })));
    if (s.ring) s._f.push(makeArea(s.ring.lat ?? s.view.lat, s.ring.lon ?? s.view.lon, s.ring.radius ?? 10));
    if (s.data) s._f.push(makeData(s.data, landAt));
    if (s.orbit) { orbitFeature ??= makeOrbit(s.view); s._f.push(orbitFeature); }
    s._f.forEach(f => allFeatures.add(f));
  }
}

// Reads the relief map once so data columns only stand on land.
function makeLandMask(img) {
  try {
    const w = 1024, h = 512, cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, w, h);
    const px = g.getImageData(0, 0, w, h).data;
    return (lat, lon) => {
      const x = Math.floor(((wrapLon(lon) + 180) / 360) * w) % w;
      const y = clamp(Math.floor(((90 - lat) / 180) * h), 0, h - 1);
      return px[(y * w + x) * 4 + 1] > LAND_G;
    };
  } catch { return null; }
}

/* ---------- navigation ---------- */
const panel = $('panel'), panelBody = $('panelBody'), track = $('track'), counter = $('counter');
const prevBtn = $('prev'), nextBtn = $('next'), hint = $('hint');
$('brandName').textContent = DECK.name;
$('brandEvent').textContent = DECK.event;

SLIDES.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.dataset.title = plain(s.title);
  btn.setAttribute('aria-label', `Slide ${i + 1}: ${plain(s.title)}`);
  if (i < 2) btn.classList.add('tip-start');
  if (i >= SLIDES.length - 2) btn.classList.add('tip-end');
  btn.addEventListener('click', () => goTo(i));
  track.appendChild(btn);
});

let current = -1, swapTimer = 0;
let sunAngle = SUN_ANGLE.day, sunTarget = sunAngle, cloudTarget = 1;
const off = { x: 0, y: 0 };
let offTarget = { x: 0, y: 0 };
let userHold = false;
const vel = { n: 0, e: 0 }, frameMove = { n: 0, e: 0 };
let pendingZoom = 0;

function layoutOffset(s) {
  if (mqPhone.matches) return { x: 0, y: s.layout === 'hero' ? 0.12 : 0.2 };
  return { x: s.layout === 'hero' ? -0.2 : -0.17, y: 0 };
}
function hideHint() { hint.classList.add('is-off'); }

function goTo(i, opts = {}) {
  i = clamp(i, 0, SLIDES.length - 1);
  if (i === current) return;
  current = i;
  const s = SLIDES[i];
  userHold = false; vel.n = vel.e = 0; pendingZoom = 0;
  const dur = flyTo(s.view, opts.instant);
  sunTarget = SUN_ANGLE[s.sun || 'day'];
  cloudTarget = s.clouds ?? 1;
  offTarget = layoutOffset(s);
  for (const f of allFeatures) f.target = 0;

  panel.classList.add('is-leaving');
  clearTimeout(swapTimer);
  swapTimer = setTimeout(() => {
    panel.classList.toggle('hero', s.layout === 'hero');
    panelBody.innerHTML = panelHTML(s);
    panelBody.scrollTop = 0;
    panel.classList.remove('is-leaving');
    for (const f of s._f || []) { f.target = 1; f.activate?.(); }
  }, dur ? clamp(dur * 0.5, 0.3, 1.5) * 1000 : 0);

  [...track.children].forEach((b, k) => {
    b.classList.toggle('done', k < i);
    b.classList.toggle('current', k === i);
    if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  counter.innerHTML = `<b>${String(i + 1).padStart(2, '0')}</b> / ${String(SLIDES.length).padStart(2, '0')}`;
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === SLIDES.length - 1;
  try { history.replaceState(null, '', '#' + s.id); } catch { /* not allowed in some viewers */ }
  if (i > 0) hideHint();
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
$('fs').addEventListener('click', toggleFullscreen);

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = e.target instanceof HTMLButtonElement;
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': goTo(current + 1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': goTo(current - 1); break;
    case ' ': case 'Enter': if (onButton) return; goTo(current + (e.shiftKey ? -1 : 1)); break;
    case 'Home': goTo(0); break;
    case 'End': goTo(SLIDES.length - 1); break;
    case 'f': case 'F': toggleFullscreen(); break;
    case 'h': case 'H': document.body.classList.toggle('chrome-off'); break;
    default:
      if (/^[1-9]$/.test(e.key)) { goTo(Number(e.key) - 1); break; }
      return;
  }
  e.preventDefault();
});

/* ---------- drag, scroll and pinch ---------- */
const pointers = new Map();
let lastPinch = 0;
function moveBy(dN, dE) {
  view.lat = clamp(view.lat + dN * R2D, -85, 85);
  view.lon += (dE * R2D) / Math.max(0.25, Math.cos(view.lat * D2R));
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add('dragging');
  flight = null; userHold = true; vel.n = vel.e = 0; lastPinch = 0;
  hideHint();
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    // grab-the-surface feel: radians per pixel at the current distance
    const k = Math.min(0.005, (2 * view.dist * Math.tan((camera.fov * D2R) / 2)) / innerHeight);
    const h = view.heading * D2R;
    const dN = (Math.sin(h) * dx + Math.cos(h) * dy) * k;
    const dE = (-Math.cos(h) * dx + Math.sin(h) * dy) * k;
    moveBy(dN, dE);
    frameMove.n += dN; frameMove.e += dE;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) pendingZoom += Math.log(lastPinch / d);
    lastPinch = d;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  lastPinch = 0;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  flight = null; userHold = true; hideHint();
  pendingZoom += clamp(e.deltaY * (e.deltaMode === 1 ? 16 : 1), -160, 160) * 0.0016;
}, { passive: false });

/* ---------- HUD ---------- */
const hudLat = $('hudLat'), hudLon = $('hudLon'), hudAlt = $('hudAlt');
let hudKey = '';
function updateHud() {
  const a = fmtLat(view.lat), b = fmtLon(view.lon);
  const c = `${Math.round((camera.position.length() - 1) * EARTH_KM).toLocaleString('en-US')} km`;
  const key = a + b + c;
  if (key === hudKey) return;
  hudKey = key;
  hudLat.textContent = a; hudLon.textContent = b; hudAlt.textContent = c;
}

/* ---------- resize ---------- */
function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setSize(w, h);
  camera.aspect = aspect;
  // in portrait, widen the lens so the planet still fits side to side
  camera.fov = aspect < 1 ? Math.min(72, 2 * Math.atan((Math.tan(20 * D2R) * 0.95) / aspect) * R2D) : 40;
  camera.updateProjectionMatrix();
  starMat.uniforms.pr.value = renderer.getPixelRatio();
  if (current >= 0) offTarget = layoutOffset(SLIDES[current]);
}
addEventListener('resize', resize);
resize();

/* ---------- frame loop ---------- */
const camRight = new THREE.Vector3(), camUp = new THREE.Vector3();
let time = 0, last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now; time += dt;
  const s = SLIDES[current];

  if (flight) stepFlight(dt);
  else {
    if (pointers.size) {
      vel.n = damp(vel.n, frameMove.n / Math.max(dt, 1e-3), 18, dt);
      vel.e = damp(vel.e, frameMove.e / Math.max(dt, 1e-3), 18, dt);
    } else if (vel.n || vel.e) {
      moveBy(vel.n * dt, vel.e * dt);
      const k = Math.exp(-3.2 * dt);
      vel.n *= k; vel.e *= k;
      if (Math.abs(vel.n) + Math.abs(vel.e) < 1e-4) vel.n = vel.e = 0;
    }
    if (s?.spin && !userHold && !reduceMotion) view.lon -= dt * 2.4;   // Earth turns west to east
  }
  frameMove.n = frameMove.e = 0;
  if (Math.abs(pendingZoom) > 1e-4) {
    const stepZ = pendingZoom * (1 - Math.exp(-10 * dt));
    view.dist = clamp(view.dist * Math.exp(stepZ), 0.2, 12);
    pendingZoom -= stepZ;
  }
  applyCamera();

  // The sun is placed relative to the view so the subject is always lit the way the slide asks.
  sunAngle = damp(sunAngle, sunTarget, 2, dt);
  camRight.setFromMatrixColumn(camera.matrixWorld, 0);
  camUp.setFromMatrixColumn(camera.matrixWorld, 1);
  sunDir.copy(T).multiplyScalar(Math.cos(sunAngle)).addScaledVector(camRight, -Math.sin(sunAngle)).addScaledVector(camUp, 0.32).normalize();
  sunLight.position.copy(sunDir).multiplyScalar(10);
  shared.cloudShift.value = reduceMotion ? 0 : time * 0.0018;
  shared.cloudAmount.value = damp(shared.cloudAmount.value, cloudTarget, 2, dt);

  for (const f of allFeatures) f.update(dt, time);

  off.x = damp(off.x, offTarget.x, 3, dt);
  off.y = damp(off.y, offTarget.y, 3, dt);
  camera.setViewOffset(innerWidth, innerHeight, off.x * innerWidth, off.y * innerHeight, innerWidth, innerHeight);

  updateLabels(dt);
  updateHud();
  renderer.render(scene, camera);
});

/* ---------- loading ---------- */
function canvasTexture(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function useFallbacks() {
  if (failed.includes(F_DAY)) {
    earthMat.uniforms.dayMap.value = canvasTexture(2048, 1024, (g, w, h) => {
      g.fillStyle = '#0c2238'; g.fillRect(0, 0, w, h);
      g.strokeStyle = 'rgba(140,200,255,0.35)'; g.lineWidth = 2;
      for (let lon = 0; lon <= 360; lon += 15) { g.beginPath(); g.moveTo((lon / 360) * w, 0); g.lineTo((lon / 360) * w, h); g.stroke(); }
      for (let lat = 0; lat <= 180; lat += 15) { g.beginPath(); g.moveTo(0, (lat / 180) * h); g.lineTo(w, (lat / 180) * h); g.stroke(); }
    });
  }
  if (failed.includes(F_NIGHT)) earthMat.uniforms.nightMap.value = canvasTexture(4, 2, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); });
  if (failed.includes(F_BRC)) {
    const t = canvasTexture(4, 2, (g, w, h) => { g.fillStyle = 'rgb(0,255,0)'; g.fillRect(0, 0, w, h); }, false);
    earthMat.uniforms.brcMap.value = cloudMat.uniforms.brcMap.value = t;
  }
  const toast = $('toast');
  toast.textContent = 'Earth imagery could not load, so this is a simplified globe. Check your internet connection and reload.';
  toast.hidden = false;
}

manager.onProgress = (url, loaded, total) => {
  $('loaderCount').textContent = `${loaded} of ${total}`;
  $('loaderBar').style.transform = `scaleX(${Math.max(0.04, loaded / total)})`;
};
manager.onLoad = () => {
  if (failed.length) useFallbacks();
  const landAt = failed.includes(F_BRC) ? null : makeLandMask(brcTex.image);
  buildFeatures(landAt);
  $('loader').classList.add('done');
  setTimeout(() => { $('loader').hidden = true; }, 1000);
  const fromHash = SLIDES.findIndex(s => '#' + s.id === location.hash);
  goTo(fromHash >= 0 ? fromHash : 0);
};
</script>
</body>
