<!doctype html>
<!--
  Analog Atlas: the pitch deck, on an interactive 3D Earth, Moon and Mars.
  Open this file in Chrome, Edge, Firefox or Safari. It works offline as long as
  the assets/ and vendor/ folders stay next to it (if the Earth textures or
  three.js are missing, it loads them from the internet instead).
  Edit the slides in the SLIDES list inside the <script type="module"> below.
  assets/analog-cells.js holds real heatmap output of the app (src/ at the repository root);
  assets/body-textures.js the NASA Trek Moon and Mars mosaics.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analog Atlas</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* Layout: full-bleed globe; slide copy rides a glass panel in the left third
   (a bottom sheet on phones); camera telemetry top right, slide track along the bottom.
   Dark only, on purpose: it's space. */
:root {
  color-scheme: dark;
  --void: #04060b;
  --glass: rgba(7, 11, 20, 0.76);
  --well: rgba(4, 7, 14, 0.78);
  --edge: rgba(206, 220, 255, 0.14);
  --line: rgba(206, 220, 255, 0.18);
  --hatch: rgba(206, 220, 255, 0.035);
  --ink: #edf0f6;
  --ink-dim: #a3acbf;
  --ink-faint: #7b859c;
  --sun: #f2b257;   /* sunlight: markers, highlights, current slide */
  --air: #8cc8ff;   /* atmosphere: orbits, secondary marks */
  --ramp-0: #123e5c; --ramp-1: #2fa7c9; --ramp-2: #f2b257; --ramp-3: #fff0c9;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gutter-l: max(28px, env(safe-area-inset-left, 0px));
  --gutter-r: max(28px, env(safe-area-inset-right, 0px));
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--void);
  color: var(--ink);
  font: 400 15px/1.55 var(--font-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }

#globe { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#globe.dragging { cursor: grabbing; }

/* ---------- map labels ---------- */
#labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.label { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
.label-stem { position: absolute; left: 0; bottom: 0; width: 1px; height: 46px; background: linear-gradient(to top, var(--sun), transparent); }
.label-text {
  position: absolute; left: 0; bottom: 46px; display: grid; gap: 3px; white-space: nowrap;
  padding: 6px 9px 6px; background: var(--well); border: 1px solid var(--edge); border-left-color: var(--sun);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.label-text b { font: 600 13.5px/1.15 var(--font-display); font-stretch: 110%; }
.label-text small { font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.label-text em { font: 500 9.5px/1.3 var(--font-mono); font-style: normal; letter-spacing: .14em; text-transform: uppercase; color: var(--sun); }
.label--air .label-text { border-left-color: var(--air); }.label--air .label-stem { background: linear-gradient(to top, var(--air), transparent); }
.label--air .label-text em { color: var(--air); }

/* ---------- top bar ---------- */
.topbar {
  position: fixed; z-index: 5; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;
  padding-top: calc(22px + env(safe-area-inset-top, 0px));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  pointer-events: none; transition: opacity .4s;
}
.topbar, .counter { text-shadow: 0 1px 10px rgba(0, 0, 0, .85), 0 0 2px rgba(0, 0, 0, .6); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 30px; height: 30px; color: var(--sun); flex: none; }
.brand-text { display: grid; gap: 2px; }
.brand-name { font: 700 15px/1.1 var(--font-display); font-stretch: 118%; letter-spacing: .01em; }
.brand-event { font: 400 10.5px/1.3 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.hud { display: flex; gap: 22px; margin: 0; font: 400 12px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
.hud div { display: grid; gap: 4px; justify-items: end; }
.hud dt { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.hud dd { margin: 0; color: var(--ink); }

/* ---------- slide panel ---------- */
.panel {
  position: fixed; z-index: 4;
  left: max(40px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%);
  width: min(450px, 38vw);
  background: var(--glass);
  border: 1px solid var(--edge); border-radius: 3px;
  -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  transition: opacity .28s ease;
}
.panel::before, .panel::after { content: ""; position: absolute; width: 12px; height: 12px; border: 0 solid var(--sun); pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
.panel::after { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }
.panel.is-leaving { opacity: 0; }
.panel-body {
  display: flex; flex-direction: column; gap: 18px;
  padding: 30px 30px 28px;
  max-height: calc(100vh - 196px); overflow: auto; scrollbar-width: thin;
}
.panel.hero {
  top: auto; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); transform: none;
  width: min(760px, 54vw);
  background: none; border-color: transparent;
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
.panel.hero::before, .panel.hero::after { display: none; }
.panel.hero .panel-body { padding: 0; max-height: none; overflow: visible; gap: 22px; }
.panel-body > * { margin: 0; animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.eyebrow { display: flex; align-items: center; gap: 10px; font: 500 11px/1.2 var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--sun); }
.eyebrow::before { content: ""; width: 18px; height: 1px; background: currentColor; flex: none; }
.title { font-family: var(--font-display); font-weight: 700; font-stretch: 118%; font-size: clamp(26px, 2.5vw, 38px); line-height: 1.04; letter-spacing: -.012em; text-wrap: balance; margin-top: -6px !important; }
.hero .title { font-weight: 800; font-stretch: 125%; font-size: clamp(50px, 6.6vw, 104px); line-height: .9; letter-spacing: -.025em; text-shadow: 0 2px 28px var(--void); }
.sub { font-size: clamp(16px, 1.35vw, 19px); line-height: 1.5; color: var(--ink-dim); max-width: 44ch; text-wrap: pretty; }
.body { color: var(--ink-dim); max-width: 60ch; text-wrap: pretty; }
.note { font: 400 12px/1.55 var(--font-mono); color: var(--ink-faint); }
.tag { display: inline-block; vertical-align: middle; margin-left: 10px; padding: 3px 5px 2px; border: 1px solid currentColor; border-radius: 2px; font: 500 9.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }

.stat { display: grid; gap: 4px; padding-block: 10px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat-value { margin: 0; display: flex; align-items: baseline; font-family: var(--font-display); font-weight: 200; font-size: clamp(64px, 7vw, 104px); line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.stat-unit { margin-left: 4px; font-size: .42em; font-weight: 400; letter-spacing: 0; color: var(--sun); }
.stat-value .tag { align-self: center; letter-spacing: .14em; }
.stat-caption { margin: 0; font-size: 13.5px; color: var(--ink-dim); }

.bullets { list-style: none; padding: 0; display: grid; }
.bullets li { display: grid; grid-template-columns: 22px 1fr; align-items: baseline; padding-block: 10px; border-top: 1px solid var(--line); }
.bullets li:last-child { border-bottom: 1px solid var(--line); }
.panel code { font: 400 .88em/1 var(--font-mono); color: var(--ink); }
.bullets li::before { content: ""; width: 10px; height: 1px; background: var(--sun); transform: translateY(-4px); }

.sources { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.sources li { display: grid; align-content: start; gap: 5px; padding: 14px 14px 13px; background: var(--well); min-width: 0; }
.sources b { font: 600 14px/1.2 var(--font-display); font-stretch: 108%; }
.sources span { font: 400 11px/1.45 var(--font-mono); color: var(--ink-dim); }

.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { padding: 0 0 10px; text-align: left; font: 500 10px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.table th:last-child, .table td:last-child { text-align: right; }
.table td { padding-block: 11px; border-top: 1px solid var(--line); }
.num { display: inline-flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.bar { position: relative; width: 84px; height: 4px; background: var(--line); }
.bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--v) * 100%); background: var(--sun); }

.legend { display: grid; gap: 8px; }
.legend-head { display: flex; justify-content: space-between; align-items: center; font: 500 10px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.legend-head .tag { margin: 0; }
.ramp { height: 8px; background: linear-gradient(90deg, var(--ramp-0), var(--ramp-1) 35%, var(--ramp-2) 70%, var(--ramp-3)); }
.legend-ends { display: flex; justify-content: space-between; font: 400 11px/1 var(--font-mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }

.media { display: grid; gap: 10px; }
.media-slot, .media img, .media video { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 1px solid var(--edge); }
.media-slot {
  display: grid; place-content: center; justify-items: center; gap: 8px; padding: 16px; text-align: center;
  border-style: dashed; border-color: var(--line); color: var(--ink-dim); font-size: 13px;
  background: repeating-linear-gradient(135deg, transparent 0 10px, var(--hatch) 10px 20px);
}
.media-slot svg { width: 26px; height: 26px; color: var(--sun); }
.media-slot code { font: 400 11px/1.4 var(--font-mono); color: var(--ink-faint); }
.media figcaption { font-size: 13.5px; color: var(--ink-dim); }

.team { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; }
.team li { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 12px; min-width: 0; }
.avatar { width: 44px; height: 44px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--edge); border-radius: 50%; background: var(--well); color: var(--ink-faint); }
.avatar svg { width: 22px; height: 22px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who { display: grid; gap: 2px; min-width: 0; }
.who b { font: 600 14px/1.2 var(--font-display); font-stretch: 108%; }
.who span { font: 400 11px/1.35 var(--font-mono); color: var(--ink-dim); }

.meta { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 18px; font: 500 11.5px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.meta li:not(:last-child) { padding-right: 18px; border-right: 1px solid var(--line); }

.links { display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; }
.links dt { padding-top: 2px; font: 500 10.5px/1.6 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.links dd { margin: 0; font: 400 14px/1.6 var(--font-mono); color: var(--ink); overflow-wrap: anywhere; }

/* ---------- blocks added for the Analog Atlas deck ---------- */
.panel.wide { width: min(560px, 44vw); }
.stage { display: flex; gap: 4px; list-style: none; padding: 0; }
.stage li { flex: 1; min-width: 0; display: grid; gap: 6px; font: 500 9px/1.2 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage li::before { content: ""; height: 2px; background: var(--line); }
.stage li.on { color: var(--sun); }
.stage li.on::before { background: var(--sun); }
.stage li.past::before { background: var(--ink-faint); }

.quote { margin: 0; padding: 4px 0 4px 16px; border-left: 2px solid var(--sun); display: grid; gap: 8px; }
.quote p { margin: 0; font: 500 clamp(17px, 1.45vw, 21px)/1.35 var(--font-display); font-stretch: 105%; color: var(--ink); text-wrap: balance; }
.quote cite { font: 400 11px/1.45 var(--font-mono); font-style: normal; color: var(--ink-dim); }

.evidence { list-style: none; padding: 0; display: grid; }
.evidence li { display: grid; grid-template-columns: minmax(0, auto) 1fr; gap: 4px 16px; align-items: baseline; padding-block: 12px; border-top: 1px solid var(--line); }
.evidence li:last-child { border-bottom: 1px solid var(--line); }
.evidence li.noval { grid-template-columns: 1fr; }
.ev-value { grid-row: span 2; font: 300 clamp(30px, 2.6vw, 40px)/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.ev-value small { margin-left: 3px; font-size: .42em; font-weight: 400; letter-spacing: 0; color: var(--sun); }
.ev-text { font-size: 14px; line-height: 1.5; color: var(--ink-dim); text-wrap: pretty; }
.ev-text b { color: var(--ink); font-weight: 600; }
.ev-cite { font: 400 10.5px/1.45 var(--font-mono); color: var(--ink-faint); }

.stats { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.stats li { display: grid; align-content: start; gap: 6px; padding: 12px 12px 13px; background: var(--well); min-width: 0; }
.stats b { font: 300 clamp(24px, 2.2vw, 32px)/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stats b small { margin-left: 2px; font-size: .5em; font-weight: 400; color: var(--sun); letter-spacing: 0; }
.stats span { font: 400 11px/1.4 var(--font-mono); color: var(--ink-dim); }

.flow { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; counter-reset: flow; }
.flow li { counter-increment: flow; display: flex; align-items: center; gap: 8px; padding: 7px 11px 7px 8px; border: 1px solid var(--edge); background: var(--well); font: 500 12.5px/1 var(--font-body); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.flow li::before { content: counter(flow, decimal-leading-zero); font: 500 10px/1 var(--font-mono); color: var(--sun); }

.steps { list-style: none; padding: 0; display: grid; counter-reset: step; }
.steps li { counter-increment: step; position: relative; display: grid; gap: 3px; padding: 0 0 16px 38px; }
.steps li::before { content: counter(step); position: absolute; left: 0; top: -1px; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--sun); border-radius: 50%; font: 500 11px/1 var(--font-mono); color: var(--sun); background: var(--well); }
.steps li::after { content: ""; position: absolute; left: 12px; top: 25px; bottom: 2px; width: 1px; background: var(--line); }
.steps li:last-child { padding-bottom: 0; }
.steps li:last-child::after { display: none; }
.steps b { font: 600 15px/1.25 var(--font-display); font-stretch: 108%; }
.steps span { font-size: 13.5px; line-height: 1.5; color: var(--ink-dim); }

.bars { display: grid; gap: 10px; }
.bars-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 10px/1.3 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.bars-head b { font: 300 30px/1 var(--font-display); letter-spacing: -.03em; color: var(--ink); text-transform: none; }
.bars table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.bars td { padding-block: 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.bars td.w { width: 44px; font: 400 11px/1 var(--font-mono); color: var(--ink-faint); text-align: right; padding-right: 14px; }
.bars td.v { width: 150px; }
.bars td.q { width: 70px; text-align: right; font: 500 9.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
.bars td.q.est { color: var(--sun); }

.table td small { display: block; margin-top: 2px; font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-faint); }
.table td.rank { font: 400 12px/1 var(--font-mono); color: var(--ink-dim); white-space: nowrap; }
.table th.rank, .table td.rank { text-align: right; padding-left: 14px; }
.table th:nth-child(2), .table td:nth-child(2) { text-align: right; }

.qr-wrap { display: flex; align-items: center; gap: 22px; }
.qr { flex: none; width: 168px; height: 168px; padding: 10px; background: #fff; border-radius: 4px; }
.qr svg { display: block; width: 100%; height: 100%; }
.qr-text { display: grid; gap: 6px; min-width: 0; }
.qr-text b { font: 600 16px/1.2 var(--font-display); font-stretch: 108%; }
.qr-text span { font: 400 12.5px/1.45 var(--font-mono); color: var(--ink-dim); overflow-wrap: anywhere; }
.hero .qr-wrap { margin-top: 4px; }

/* ---------- 7-slide deck: very wide panel, columns, user cards, cost ledger ---------- */
.panel.xwide { width: min(900px, 64vw); }
.panel.xwide .panel-body { gap: 16px; padding: 26px 28px 24px; }
.cols { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 22px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.col > * { margin: 0; }
.col-head { font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--sun); }
.lead { font: 500 clamp(15px, 1.2vw, 17px)/1.45 var(--font-body); color: var(--ink); max-width: 70ch; text-wrap: pretty; }
.lead b { color: var(--sun); font-weight: 600; }

.cards { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.cards > li { display: grid; align-content: start; gap: 8px; padding: 14px 15px 15px; background: var(--well); min-width: 0; }
.card-who { display: flex; align-items: baseline; gap: 10px; }
.card-who b { font: 600 15.5px/1.2 var(--font-display); font-stretch: 108%; }
.card-who span { font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-faint); }
.card-goal { font-size: 12.5px; line-height: 1.45; color: var(--ink-dim); font-style: italic; }
.cards ol { margin: 0; padding: 0; list-style: none; counter-reset: c; display: grid; gap: 5px; }
.cards ol li { counter-increment: c; display: grid; grid-template-columns: 18px 1fr; font-size: 12.5px; line-height: 1.42; color: var(--ink-dim); }
.cards ol li::before { content: counter(c); font: 500 10px/1.6 var(--font-mono); color: var(--sun); }
.cards ol li b { color: var(--ink); font-weight: 600; }

.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
.ledger td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
.ledger td:first-child { padding-right: 12px; }
.ledger td small { display: block; margin-top: 2px; font: 400 10.5px/1.35 var(--font-mono); color: var(--ink-faint); }
.ledger td.amt { text-align: right; white-space: nowrap; font: 500 14px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.ledger tr.total td { border-top: 1px solid var(--sun); padding-top: 9px; font-weight: 600; color: var(--ink); }
.ledger tr.total td.amt { color: var(--sun); font-size: 16px; }
.ledger caption { caption-side: top; text-align: left; padding-bottom: 8px; font: 500 10.5px/1.3 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }

.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 12px 14px; background: var(--well); border: 1px solid var(--line); }
.vs div { display: grid; gap: 4px; min-width: 0; }
.vs b { font: 300 clamp(24px, 2.2vw, 32px)/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.vs .good b { color: var(--sun); }
.vs span { font: 400 11px/1.4 var(--font-mono); color: var(--ink-dim); }
.vs i { font: 500 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; font-style: normal; color: var(--ink-faint); }

.panel .team { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel .team li { grid-template-columns: 34px 1fr; gap: 9px; }
.panel .team .avatar { width: 34px; height: 34px; }

@media (max-width: 1100px) { .panel.xwide { width: min(900px, 76vw); } }
/* Big-screen type: everything scales with the viewport so it reads from the back of a room. */
@media (min-width: 761px) {
  .panel.wide { width: min(640px, 46vw); }
  .panel.xwide { width: min(1060px, 68vw); }
  .panel-body { max-height: calc(100vh - 170px); }

/* ---------- Earth, clouds, atmosphere, stars ---------- */
const sunDir = new THREE.Vector3(1, 0.3, 0.5).normalize();

const SPHERE_VS = /* glsl */`
  varying vec2 vUv; varying vec3 vN; varying vec3 vP;
  void main() {
    vUv = uv;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vP = wp.xyz;
    vN = normalize(mat3(modelMatrix) * normal);

const earthMat = new THREE.ShaderMaterial({
  uniforms: {
    ...shared, dayMap: { value: dayTex }, nightMap: { value: nightTex }, brcMap: { value: brcTex }, bumpMap: { value: brcTex },

    varying vec2 vUv; varying vec3 vN; varying vec3 vP;

    // Earth: relief channel of the brc map. Moon and Mars: brightness of the mosaic itself.

      vec3 sx = dFdx(vP), sy = dFdy(vP);

    }

    void main() {

      vec3 L = normalize(sunDir);
      vec3 V = normalize(cameraPosition - vP);
      float sunGeo = dot(n, L);
      float dayMix = smoothstep(-0.10, 0.30, sunGeo);

      vec4 brc = texture2D(brcMap, vUv);
      float cloud = smoothstep(0.2, 1.0, texture2D(brcMap, vUv + vec2(cloudShift, 0.0)).b) * cloudAmount * earthAmt;
      float water = (1.0 - smoothstep(0.05, 0.35, brc.g)) * earthAmt;

      vec3 day = texture2D(dayMap, vUv).rgb;

      vec3 col = day * (diffuse * mix(1.25, 1.1, earthAmt) + 0.012) * (1.0 - cloud * 0.4);

const cloudMat = new THREE.ShaderMaterial({

const starMat = (() => {

/* ---------- camera rig ---------- */
// The camera is described by the point it looks at plus distance, tilt and heading.
const view = { lat: 42, lon: -112, dist: 16, tilt: 0, heading: 0 };
const T = new THREE.Vector3();
function applyCamera() {
  view.lat = clamp(view.lat, -85, 85);
  view.lon = wrapLon(view.lon);
  const f = frameAt(view.lat, view.lon);
  const t = view.tilt * D2R, h = view.heading * D2R;
  const fwd = f.north.clone().multiplyScalar(Math.cos(h)).addScaledVector(f.east, Math.sin(h));
  const dir = f.n.clone().multiplyScalar(Math.cos(t)).addScaledVector(fwd, -Math.sin(t));
  const ct = Math.cos(t), minR = 1.1;                       // stay outside the atmosphere shell
  view.dist = Math.max(view.dist, -ct + Math.sqrt(ct * ct - 1 + minR * minR));
  T.copy(f.n);
  camera.position.copy(T).addScaledVector(dir, view.dist);
  camera.up.copy(fwd).multiplyScalar(Math.cos(t)).addScaledVector(f.n, Math.sin(t));
  camera.lookAt(T);
  camera.updateMatrixWorld();
}

let flight = null;
function slerpUnit(a, b, theta, t) {

  const s = Math.sin(theta);
  if (s < 1e-4) return a.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI * t);
  return a.clone().multiplyScalar(Math.sin((1 - t) * theta) / s).addScaledVector(b, Math.sin(t * theta) / s);
}
function flyTo(v, instant) {
  const to = { lat: v.lat, lon: v.lon, dist: v.dist, tilt: v.tilt ?? 0, heading: v.heading ?? 0 };
  if (instant || reduceMotion) { Object.assign(view, to); flight = null; return 0; }
  const from = { ...view };
  const a = llToVec(from.lat, from.lon), b = llToVec(to.lat, to.lon);
  const theta = a.angleTo(b);
  const dur = clamp(1.5 + theta * 0.95 + Math.abs(Math.log(to.dist / from.dist)) * 0.28, 1.6, 3.8);
  flight = { from, to, a, b, theta, dur, t: 0 };

/* ---------- labels ---------- */
const labelsEl = $('labels');
const labels = [];
function makeLabel(pos, html, cls = '') {
  const el = document.createElement('div');
  el.className = 'label ' + cls;
  el.innerHTML = `<span class="label-stem"></span><span class="label-text">${html}</span>`;
  labelsEl.appendChild(el);
  const L = { el, pos, alpha: 0, vis: 0, on: false };
  labels.push(L);
  return L;
}
const tmp = new THREE.Vector3(), pv = new THREE.Vector3();
function occluded(P) {
  const C = camera.position;
  tmp.subVectors(P, C);
  const len = tmp.length();
  tmp.divideScalar(len);
  const b = C.dot(tmp), disc = b * b - (C.lengthSq() - 1);
  if (disc <= 0) return false;
  const hit = -b - Math.sqrt(disc);
  return hit > 0 && hit < len - 0.004;

function updateLabels(dt) {
  const W = innerWidth, H = innerHeight;
  for (const L of labels) {
    if (L.alpha < 0.01) {
      if (L.on) { L.el.style.opacity = '0'; L.on = false; }
      continue;
    }
    L.on = true;
    pv.copy(L.pos).project(camera);
    L.vis = damp(L.vis, pv.z > 1 || occluded(L.pos) ? 0 : 1, 12, dt);
    const x = (pv.x * 0.5 + 0.5) * W, y = (-pv.y * 0.5 + 0.5) * H;
    // slide the label box sideways so it never runs off screen
    L.w ||= L.el.lastChild.offsetWidth;
    const shift = Math.round(Math.max(16 - x, Math.min(0, W - 16 - L.w - x)));
    if (shift !== L.shift) { L.shift = shift; L.el.lastChild.style.transform = shift ? `translateX(${shift}px)` : ''; }
    L.el.style.opacity = (L.alpha * L.vis).toFixed(3);
    L.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
  }

/* ---------- scene features (markers, study area, data columns, orbit) ---------- */
const Z = new THREE.Vector3(0, 0, 1);
const allFeatures = new Set();
function fade(f, dt, speed = 3) {
  f.alpha = damp(f.alpha, f.target, speed, dt);
  if (Math.abs(f.alpha - f.target) < 0.002) f.alpha = f.target;
}

const ringGeo = new THREE.RingGeometry(0.7, 1, 64);
const dotGeo = new THREE.CircleGeometry(0.3, 32);
function makeMarker({ lat, lon, label, note, sub }) {
  const pos = llToVec(lat, lon, 1.0015);
  const group = new THREE.Group();
  group.position.copy(pos);
  group.quaternion.setFromUnitVectors(Z, pos.clone().normalize());
  const ringMat = new THREE.MeshBasicMaterial({ color: COLOR_SUN, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
  const dotMat = ringMat.clone();
  const ring = new THREE.Mesh(ringGeo, ringMat), dot = new THREE.Mesh(dotGeo, dotMat);
  ring.renderOrder = dot.renderOrder = 5;
  group.add(ring, dot);
  group.visible = false;
  scene.add(group);
  const lab = makeLabel(pos, `<b>${label}</b><small>${sub ?? `${fmtLat(lat)} · ${fmtLon(lon)}`}</small>${note ? `<em>${note}</em>` : ''}`);
  const phase = Math.random();
  return {
    alpha: 0, target: 0,
    update(dt, time) {
      fade(this, dt);

      if (!group.visible) return;
      group.scale.setScalar(camera.position.distanceTo(pos) * 0.016);   // constant size on screen
      const p = reduceMotion ? 0.4 : (time * 0.55 + phase) % 1;

function makeArea(lat, lon, radiusDeg, label, sub) {
  const f = frameAt(lat, lon), rho = radiusDeg * D2R, pts = [];
  for (let i = 0; i <= 200; i++) {
    const a = (i / 200) * Math.PI * 2;
    pts.push(f.n.clone().multiplyScalar(Math.cos(rho))
      .addScaledVector(f.north, Math.sin(rho) * Math.cos(a))
      .addScaledVector(f.east, Math.sin(rho) * Math.sin(a))
      .multiplyScalar(1.004));
  }
  const mat = new THREE.LineDashedMaterial({ color: COLOR_SUN, dashSize: 0.014, gapSize: 0.009, transparent: true, opacity: 0, depthWrite: false });
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
  line.computeLineDistances();
  line.renderOrder = 4;
  line.visible = false;
  scene.add(line);
  const lab = label === false ? { alpha: 0 } : makeLabel(pts[0].clone(), `<b>${label ?? 'Study area'}</b><small>${sub ?? `radius ≈ ${Math.round(radiusDeg * 111.2).toLocaleString('en-US')} km`}</small>`);
  return {
    alpha: 0, target: 0,
    update(dt) {

      line.visible = this.alpha > 0.01;

// Real model output: one column per 0.5° land cell, [lat, lon, similarity 0..1].
// Height and colour both show similarity on a fixed scale (0 to cfg.max), like the app's heatmap.
function makeData(cfg) {

  const rng = mulberry32(7);

    ? makeLabel(peak.v.clone().multiplyScalar(1 + peak.val * HMAX), `<b>${cfg.peak.label} · ${Math.round(peak.score * 100)}%</b><small>${fmtLat(peak.lat)} · ${fmtLon(peak.lon)}</small>${cfg.peak.note ? `<em>${cfg.peak.note}</em>` : ''}`)

/* ---------- resize ---------- */
function resize() {

  camera.fov = aspect < 1 ? Math.min(72, 2 * Math.atan((Math.tan(20 * D2R) * 0.95) / aspect) * R2D) : 40;

    if (!swap.done) {
      const k = clamp(swap.t / 0.7, 0, 1);
      shared.fade.value = 1 - k;
      view.dist *= Math.exp(dt * 0.9);
      if (k >= 1) {
        setBody(swap.body);
        const v = swap.view;
        Object.assign(view, { lat: clamp(v.lat - 10, -80, 80), lon: v.lon + 30, dist: Math.max(3.6, v.dist * 2.4), tilt: 0, heading: v.heading ?? 0 });
        flyTo(v);
        swap.done = true; swap.t = 0;
      }
    } else {
      shared.fade.value = clamp(swap.t / 0.8, 0, 1);
      if (swap.t >= 0.8) swap = null;
    }
  }
  if (swap && !swap.done) { /* the swap moves the camera itself */ }
  else if (flight) stepFlight(dt);
  else {
    if (pointers.size) {

      vel.e = damp(vel.e, frameMove.e / Math.max(dt, 1e-3), 18, dt);

  camUp.setFromMatrixColumn(camera.matrixWorld, 1);

}
function useFallbacks() {
  if (failed.includes(F_DAY)) {
    earthMat.uniforms.dayMap.value = canvasTexture(2048, 1024, (g, w, h) => {
      g.fillStyle = '#0c2238'; g.fillRect(0, 0, w, h);
      g.strokeStyle = 'rgba(140,200,255,0.35)'; g.lineWidth = 2;
      for (let lon = 0; lon <= 360; lon += 15) { g.beginPath(); g.moveTo((lon / 360) * w, 0); g.lineTo((lon / 360) * w, h); g.stroke(); }
      for (let lat = 0; lat <= 180; lat += 15) { g.beginPath(); g.moveTo(0, (lat / 180) * h); g.lineTo(w, (lat / 180) * h); g.stroke(); }
    });
  }
  if (failed.includes(F_NIGHT)) earthMat.uniforms.nightMap.value = canvasTexture(4, 2, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); });
  if (failed.includes(F_BRC)) {
    const t = canvasTexture(4, 2, (g, w, h) => { g.fillStyle = 'rgb(0,255,0)'; g.fillRect(0, 0, w, h); }, false);
    earthMat.uniforms.brcMap.value = cloudMat.uniforms.brcMap.value = t;
  }
  const toast = $('toast');
  toast.textContent = 'Earth imagery could not load, so this is a simplified globe. Check your internet connection and reload.';
  toast.hidden = false;
}

manager.onProgress = (url, loaded, total) => {
  $('loaderCount').textContent = `${loaded} of ${total}`;
  $('loaderBar').style.transform = `scaleX(${Math.max(0.04, loaded / total)})`;
};
manager.onLoad = () => {
  if ([F_DAY, F_NIGHT, F_BRC].some(f => failed.includes(f))) useFallbacks();
  buildFeatures();
  $('loader').classList.add('done');
  setTimeout(() => { $('loader').hidden = true; }, 1000);
  const fromHash = SLIDES.findIndex(s => '#' + s.id === location.hash);
  goTo(fromHash >= 0 ? fromHash : 0);
};
</script>
